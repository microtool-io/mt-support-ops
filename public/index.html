<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mt-support-ops</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="sidebar.js" defer></script>
</head>
<body>
  <aside id="sidebar" aria-label="Sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <svg viewBox="34 70 222 144" width="38" height="25" role="img" aria-label="Microtool">
          <path transform="translate(-2 -10)" fill="currentColor" stroke="currentColor"
                stroke-width="4" stroke-linejoin="round"
                d="M44 188 Q40 188 40 184 V116 Q40 84 72 84 H104
                   Q120 84 128 100 Q136 84 152 84 H184 Q216 84 216 116
                   V132 H250 Q254 132 254 136 V160 Q254 164 250 164
                   H216 V180 Q216 188 224 188 H240 Q244 188 244 192
                   V216 Q244 220 240 220 H220 Q184 220 184 184
                   V128 Q184 116 172 116 H156 Q144 116 144 128
                   V184 Q144 188 140 188 H116 Q112 188 112 184
                   V128 Q112 116 100 116 H84 Q72 116 72 128
                   V184 Q72 188 68 188 H44 Z"/>
        </svg>
        <span>CS Ops</span>
      </div>
      <button class="sidebar-toggle" type="button" aria-controls="sidebar"
              aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4" width="19" height="16" rx="2.5"/>
          <path d="M8.5 4v16"/>
          <path class="toggle-chevron" d="m16 9-3 3 3 3"/>
        </svg>
      </button>
    </div>
    <section class="sidebar-section business-areas" aria-labelledby="areas-title">
      <header class="areas-header">
        <h2 class="sidebar-section-label" id="areas-title">Business areas</h2>
        <button class="add-area" type="button" aria-haspopup="dialog" aria-controls="area-dialog"
                aria-label="New business area" title="New business area">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <p id="load-error" class="area-error" role="alert" hidden></p>
      <div id="area-list"></div>
      <div id="areas-empty" hidden>
        <p>No business areas yet</p>
        <button class="create-first-area" type="button" aria-haspopup="dialog" aria-controls="area-dialog">Create area</button>
      </div>
    </section>
    <section class="sidebar-section" id="hubspot-section" aria-labelledby="hubspot-title" hidden>
      <h2 class="sidebar-section-label" id="hubspot-title">HubSpot</h2>
    </section>
    <button class="sidebar-settings" type="button" aria-label="Settings" title="Settings"
            aria-controls="settings-dialog" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.1 4.9 10.3 2.3 13.7 2.3 13.9 4.9
                 15.7 5.7 17.6 4.0 20.0 6.4 18.3 8.4
                 19.1 10.1 21.7 10.3 21.7 13.7 19.1 13.9
                 18.3 15.6 20.0 17.6 17.6 20.0 15.7 18.3
                 13.9 19.1 13.7 21.7 10.3 21.7 10.1 19.1
                 8.4 18.3 6.4 20.0 4.0 17.6 5.7 15.6
                 4.9 13.9 2.3 13.7 2.3 10.3 4.9 10.1
                 5.7 8.3 4.0 6.4 6.4 4.0 8.3 5.7Z"/>
        <circle cx="12" cy="12" r="3.1"/>
      </svg>
    </button>
  </aside>
  <main aria-label="Workspace"><h1 id="workspace-title" hidden></h1></main>
  <dialog id="area-dialog" aria-labelledby="new-area-title" closedby="any">
    <form id="area-form">
      <h2 id="new-area-title">New business area</h2>
      <label for="area-name">Area name</label>
      <input id="area-name" name="areaName" maxlength="100" required autofocus autocomplete="off">
      <p id="save-error" class="area-error" role="alert" hidden></p>
      <footer>
        <button type="button" data-dismiss>Cancel</button>
        <button type="submit">Create area</button>
      </footer>
    </form>
  </dialog>
  <dialog id="settings-dialog" aria-label="Settings" closedby="any">
    <nav class="settings-sidebar" aria-label="Settings sections">
      <a href="#ai-connection" aria-current="location">AI connection</a>
      <a href="#connections">Connections</a>
    </nav>
    <div class="settings-pane">
      <header class="settings-pane-header">
        <div class="settings-heading">
          <span class="settings-parent">Settings <span aria-hidden="true">›</span></span>
          <h2 id="settings-section-title">AI connection</h2>
        </div>
        <button type="button" aria-label="Close settings" autofocus>
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true">
            <path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <div id="ai-connection"></div>
      <div id="connections" hidden>
        <div class="connection-row">
          <span class="connection-name">HubSpot</span>
          <span class="connection-status" id="hubspot-status" role="status">Not connected</span>
          <button class="connection-test" type="button" aria-describedby="hubspot-status">Test connection</button>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
