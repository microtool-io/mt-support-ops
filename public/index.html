<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Departments · Support Ops</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside id="sidebar">
      <div class="brand-row"><a href="#/" class="brand"><img src="/mark.svg" alt="" width="34" height="34"><span>Microtool<small>Support Ops</small></span></a>
        <button id="menu" class="menu" aria-expanded="false" aria-controls="navigation">Menu</button></div>
      <nav id="navigation" aria-label="Workspace navigation">
        <a id="directory-link" class="nav-link" href="#/"><span data-icon="grid"></span>All departments</a>
        <div class="nav-heading"><span>Departments</span><button id="nav-new" class="icon-button" aria-label="Create a department"><span data-icon="plus"></span></button></div>
        <div id="dept-links"></div>
        <div class="nav-bottom"><a id="model-link" href="#/connection" class="nav-link"><span data-icon="connection"></span>Model connection</a></div>
      </nav>
    </aside>
    <main id="content" tabindex="-1">
      <header class="topbar"><div class="breadcrumb"><span>Workspace</span><span aria-hidden="true">/</span><span id="crumb">Departments</span></div><span class="local"><span data-icon="device"></span>Local workspace</span></header>
      <div class="page"><div id="notice" role="status" aria-live="polite"></div><div id="view" aria-busy="true">Opening workspace…</div></div>
    </main>
  </div>
  <dialog id="create-dialog" aria-labelledby="dialog-title"><form id="new-form">
    <div class="section-head"><h2 id="dialog-title">New department</h2><button type="button" id="close-dialog" class="icon-button" aria-label="Close"><span data-icon="close"></span></button></div>
    <label>Department name<input name="name" required maxlength="70" placeholder="e.g. Product & engineering"></label>
    <label>Customer support remit<textarea name="remit" rows="3" required maxlength="1000" placeholder="What should this department track for customer support?"></textarea></label>
    <label>Managing agent name <span class="optional">(optional)</span><input name="manager" maxlength="90" placeholder="Defaults to the department name + manager"></label>
    <p id="form-error" class="error" role="alert"></p>
    <div class="dialog-actions"><button type="button" id="cancel-dialog">Cancel</button><button class="primary" type="submit">Create department</button></div>
  </form></dialog>
</body>
</html>
